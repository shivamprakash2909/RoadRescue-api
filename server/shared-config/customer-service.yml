server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:roadrescue}?currentSchema=customer_schema
    username: ${DB_USER:roadrescue_user}
    password: ${DB_PASSWORD:roadrescue_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: customer_schema
  flyway:
    enabled: true
    schemas: customer_schema
    default-schema: customer_schema
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:superSecretKeyForRoadRescueProjectWhichMustBeAtLeast256BitsLongAndSecure!}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

